[project]
name = "alpaca-options-agent"
version = "0.1.0"
description = "Autonomous options trading agent that writes its own decision programs"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.42",
    "anthropic>=1.2",
    "openai>=3.0",
    "httpx>=0.27",
    "websockets>=15",
    "msgpack>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "python-dotenv>=1.0",
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
