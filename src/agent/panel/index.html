<meta charset="utf-8">
<title>alpaca agent</title>
<style>
  :root {
    --bg:#0c0e11; --fg:#d6dae1; --dim:#6a7280; --dimmer:#3b4149;
    --rule:#1c2026; --up:#7fb289; --down:#c08a86; --hl:#1a1f26;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#fbfbfa; --fg:#1a1d21; --dim:#8b9198; --dimmer:#c3c7cc;
            --rule:#e6e7e9; --up:#3f7d4e; --down:#a4534d; --hl:#f2f2f0; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.55 ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
    padding:26px 28px 48px;
  }
  .cols { display:grid; grid-template-columns:minmax(0,1fr); gap:0 44px; }
  .left, .right { min-width:0; }
  .scroll { overflow-x:auto; }
  @media (min-width:1100px) {
    .cols { grid-template-columns:minmax(360px,0.85fr) minmax(0,1.15fr); }
    .right { position:sticky; top:26px; align-self:start; }
  }
  h1 { font-size:13px; font-weight:500; margin:0 0 22px; letter-spacing:.02em; }
  h1 .meta { color:var(--dim); font-weight:400; }
  section { margin:0 0 26px; }
  .label {
    color:var(--dim); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    padding-bottom:6px; border-bottom:1px solid var(--rule); margin-bottom:12px;
  }
  table { border-collapse:collapse; width:100%; }
  td, th { padding:2px 14px 2px 0; text-align:left; font-weight:400; white-space:nowrap; }
  th { color:var(--dim); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
       padding-bottom:6px; }
  td.n, th.n { text-align:right; padding-right:0; }
  .up { color:var(--up); } .down { color:var(--down); } .dim { color:var(--dim); }
  .big { font-size:22px; letter-spacing:-.01em; white-space:nowrap; }
  .big .pct { font-size:12px; }
  .row { display:grid; grid-template-columns:repeat(4,auto); gap:0 26px;
         align-items:end; justify-content:start; }
  @media (max-width:520px) { .row { grid-template-columns:repeat(2,auto); gap:14px 26px; } }
  svg { display:block; width:100%; height:120px; overflow:visible; margin-top:4px; }
  .log { max-height:520px; overflow-y:auto; }
  /* After the base rule, or equal specificity lets 520px win on every screen. */
  @media (min-width:1100px) {
    /* The decisions column runs to the bottom of the viewport; dead space below
       the fold is space that could be showing another cycle. */
    .log { max-height:calc(100vh - 150px); }
    svg { height:150px; }
  }
  .cyc { padding:12px 0 14px; border-bottom:1px solid var(--rule); }
  .cyc:last-child { border-bottom:0; }
  .cyc .hd { color:var(--dim); font-size:11px; margin-bottom:7px; }
  .cyc .hd b { color:var(--fg); font-weight:500; }
  .ev { margin:0 0 6px; }
  .ev .k { color:var(--dim); font-size:10px; letter-spacing:.1em;
           text-transform:uppercase; margin-right:8px; }
  .ev .t { white-space:pre-wrap; word-break:break-word; }
  .thought .t { color:var(--fg); }
  .evidence .t, .verification .t { color:var(--dim); font-size:12px; }
  .program .t, .traceback .t { font-size:12px; }
  .program .t { color:var(--fg); }
  .traceback .t { color:var(--down); }
  .ev .meta { color:var(--dimmer); font-size:10.5px; margin-left:8px; }
  details pre { margin:6px 0 0; padding:8px 10px; background:var(--hl);
                border-radius:2px; overflow-x:auto; white-space:pre;
                font-size:11.5px; line-height:1.5; }
  .order .t, .fill .t { color:var(--fg); }
  .order, .fill { background:var(--hl); margin:0 -10px 6px; padding:6px 10px; }
  .error .t { color:var(--down); white-space:pre-wrap; }
  .fallback .t { color:var(--down); white-space:pre-wrap; }
  details > summary { cursor:pointer; color:var(--dim); font-size:11px;
           list-style:none; padding-top:2px; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary:before { content:"+ "; }
  details[open] > summary:before { content:"− "; }
  .empty { color:var(--dimmer); }
  a { color:inherit; }
</style>

<h1>alpaca options agent <span class="meta" id="hdr">connecting…</span></h1>

<div class="cols">
<div class="left">

<section>
  <div class="row">
    <div><div class="label">equity</div><div class="big" id="eq">—</div></div>
    <div><div class="label">p&amp;l</div><div class="big" id="pnl">—</div></div>
    <div><div class="label">session</div><div class="big" id="ses">—</div></div>
    <div><div class="label">cycles</div><div class="big" id="cyc">—</div></div>
  </div>
</section>

<section>
  <div class="label">equity, scored window</div>
  <svg id="chart" viewBox="0 0 1000 132" preserveAspectRatio="none"></svg>
</section>

<section>
  <div class="label">portfolio</div>
  <table id="pos"><tbody><tr><td class="empty">no open positions</td></tr></tbody></table>
</section>

<section>
  <div class="label">baselines</div>
  <div class="scroll"><table id="shadow"><tbody><tr><td class="empty">no shadow book yet</td></tr></tbody></table></div>
</section>

<section>
  <div class="label">model usage</div>
  <div class="scroll"><table id="usage"><tbody><tr><td class="empty">no calls yet</td></tr></tbody></table></div>
</section>

</div>
<div class="right">

<section>
  <div class="label">decisions</div>
  <div class="log" id="log"><div class="empty">no cycles yet</div></div>
</section>

</div>
</div>

<script>
const $ = i => document.getElementById(i);
const money = v => (v<0?"−":"") + "$" + Math.abs(v).toLocaleString("en-US",
  {minimumFractionDigits:2, maximumFractionDigits:2});
const sign = v => (v>0?"+":v<0?"−":"") ;
const cls  = v => v>0?"up":v<0?"down":"dim";
const clock = t => t ? new Date(t).toLocaleTimeString("en-GB",{hour12:false}) : "";

function chart(pts, base) {
  const el = $("chart");
  if (!pts.length) { el.innerHTML = '<text x="0" y="70" fill="var(--dimmer)" font-size="12">no data yet</text>'; return; }
  const W=1000, H=132, P=10;
  const vals = pts.map(p=>p.v).concat([base]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi-lo < 1) { hi += 50; lo -= 50; }
  const pad = (hi-lo)*0.12; lo -= pad; hi += pad;
  const x = i => P + i*(W-2*P)/Math.max(pts.length-1,1);
  const y = v => H-P - (v-lo)/(hi-lo)*(H-2*P);
  const d = pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  const col = last.v >= base ? "var(--up)" : "var(--down)";
  el.innerHTML =
    `<line x1="0" y1="${y(base).toFixed(1)}" x2="${W}" y2="${y(base).toFixed(1)}"
           stroke="var(--dimmer)" stroke-width="1" stroke-dasharray="2 4"/>
     <path d="${d}" fill="none" stroke="${col}" stroke-width="1.25"
           stroke-linejoin="round" stroke-linecap="round"/>
     <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(last.v).toFixed(1)}" r="2.5" fill="${col}"/>
     <text x="0" y="${Math.max(9, y(base)-6).toFixed(1)}" fill="var(--dimmer)"
           font-size="9" letter-spacing="0.04em">${money(base)}</text>`;
}

function positions(rows) {
  const t = $("pos").querySelector("tbody");
  if (!rows.length) { t.innerHTML = '<tr><td class="empty">no open positions</td></tr>'; return; }
  t.innerHTML = '<tr><th>symbol</th><th class="n">qty</th><th class="n">value</th>'
              + '<th class="n">unrealised</th></tr>' + rows.map(p=>{
    const u = parseFloat(p.unrealized_pl||0);
    return `<tr><td>${p.symbol}</td><td class="n">${p.qty}</td>`
         + `<td class="n">${money(parseFloat(p.market_value||0))}</td>`
         + `<td class="n ${cls(u)}">${sign(u)}${money(Math.abs(u)).replace("−","")}</td></tr>`;
  }).join("");
}

const esc = t => (t||"").replace(/[<&]/g, c => ({"<":"&lt;","&":"&amp;"}[c]));

// Text that has already been typed out once. New arrivals stream; everything
// already on screen re-renders instantly, so a poll never replays the animation.
const typed = new Set();

function typeInto(el, text, key) {
  if (typed.has(key)) { el.textContent = text; return; }
  typed.add(key);
  const n = text.length;
  // finish in roughly a second regardless of length, with a floor so short
  // lines are still visibly typed rather than appearing whole
  const per = Math.max(3, Math.ceil(n / 90));
  let i = 0;
  el.textContent = "";
  (function step() {
    i = Math.min(i + per, n);
    el.textContent = text.slice(0, i);
    if (i < n) requestAnimationFrame(step);
  })();
}

const COLLAPSIBLE = new Set(["evidence", "verification", "program", "traceback"]);

function event(e, cid, idx) {
  const k = e.kind.toLowerCase();
  const body = esc(e.text);
  const key = `${cid}:${idx}:${k}`;
  const meta = e.meta ? `<span class="meta">${esc(e.meta)}</span>` : "";
  // machine output and source collapse; the decision text never does
  // source is always collapsible; other machine output only once it is long
  if (COLLAPSIBLE.has(k) && (k === "program" || body.length > 240)) {
    const lines = body.split("\n").length;
    const label = k === "program" ? `${lines} lines of Python` : `${lines} lines`;
    return `<div class="ev ${k}"><span class="k">${k}</span>${meta}` +
      `<details><summary>${label}</summary><pre class="t">${body}</pre></details></div>`;
  }
  const stream = (k === "thought" || k === "outcome" || k === "order" || k === "fill");
  return `<div class="ev ${k}"><span class="k">${k}</span>${meta}` +
         `<span class="t"${stream?` data-type="${key}"`:""}>${stream?"":body}</span></div>`;
}

let lastLogSig = null;

function log(cycles) {
  const el = $("log");
  if (!cycles.length) { el.innerHTML = '<div class="empty">no cycles yet</div>'; return; }
  // Re-rendering on every poll would restart an animation mid-flight and flash the
  // collapsed sections shut. Only rebuild when the content actually changed.
  const sig = cycles.map(c => c.cycle + ":" + c.events.length + ":" +
                              (c.outcome || "")).join("|");
  if (sig === lastLogSig) return;
  lastLogSig = sig;
  const texts = {};
  el.innerHTML = cycles.map(c => {
    const out = c.outcome ? c.outcome.toLowerCase() : "";
    const bad = /error|blocked/.test(out);
    const body = c.events.map((e, i) => {
      texts[`${c.cycle}:${i}:${e.kind.toLowerCase()}`] = esc(e.text);
      return event(e, c.cycle, i);
    }).join("");
    return `<div class="cyc">
      <div class="hd">${clock(c.ts)}${c.trigger?` · ${esc(c.trigger)}`:""}${
        out?` · <b class="${bad?"down":""}">${out}</b>`:""}</div>${body}</div>`;
  }).join("");
  el.querySelectorAll("[data-type]").forEach(n => {
    const key = n.getAttribute("data-type");
    typeInto(n, texts[key] || "", key);
  });
}

function shadow(rows) {
  const t = $("shadow").querySelector("tbody");
  if (!rows || !rows.length) {
    t.innerHTML = '<tr><td class="empty">no shadow book yet</td></tr>'; return; }
  t.innerHTML = '<tr><th>policy</th><th class="n">return</th><th class="n">realised</th>'
    + '<th class="n">open</th><th class="n">trades</th></tr>'
    + rows.map(r => {
        const p = r.return_pct || 0;
        return `<tr><td>${r.policy}</td>`
          + `<td class="n ${cls(p)}">${sign(p)}${Math.abs(p).toFixed(2)}%</td>`
          + `<td class="n dim">${money(r.realised || 0)}</td>`
          + `<td class="n">${r.open ?? 0}</td>`
          + `<td class="n dim">${r.total ?? 0}</td></tr>`;
      }).join("")
    + '<tr><td colspan="5" class="dim" style="padding-top:6px;white-space:normal">'
    + 'fixed policies on the same live quotes. no orders are placed.</td></tr>';
}

function usage(u) {
  const t = $("usage").querySelector("tbody");
  if (!u || !u.calls) { t.innerHTML = '<tr><td class="empty">no calls yet</td></tr>'; return; }
  const rows = Object.entries(u.by_model).sort((a,b)=>b[1].calls-a[1].calls);
  const k = n => n.toLocaleString();
  const inCell = r => `${k(r.input)}${r.cached ? ` <span class="dim">+${k(r.cached)}c</span>` : ""}`;
  t.innerHTML = '<tr><th>model</th><th class="n">calls</th><th class="n">in</th>'
    + '<th class="n">out</th><th class="n">cost</th></tr>'
    + rows.map(([m,r]) =>
      `<tr><td>${m.split("/").pop()}</td><td class="n">${r.calls}</td>`
      + `<td class="n">${inCell(r)}</td>`
      + `<td class="n">${k(r.output)}</td>`
      + `<td class="n">${r.cost_usd ? "$"+r.cost_usd.toFixed(3) : "—"}</td></tr>`).join("")
    + `<tr><td class="dim">total</td><td class="n dim">${u.calls}</td>`
    + `<td class="n dim">${inCell(u)}</td>`
    + `<td class="n dim">${k(u.output)}</td>`
    + `<td class="n">${u.cost_usd ? "$"+u.cost_usd.toFixed(3) : "—"}</td></tr>`
    + (u.priced_calls < u.calls
       ? `<tr><td colspan="5" class="dim" style="padding-top:6px;white-space:normal">`
         + `+Nc is cache reads. priced for anthropic only.</td></tr>` : "");
}

async function tick() {
  try {
    const r = await fetch("/api/state", {cache:"no-store"});
    const s = await r.json();
    $("hdr").textContent = `· ${s.profile}/${s.mode} · ${s.model||"—"} · ${clock(s.now)}`;
    $("eq").textContent  = s.equity ? money(s.equity) : "—";
    const p = s.equity - s.starting;
    $("pnl").innerHTML = s.equity
      ? `<span class="${cls(p)}">${sign(p)}${money(Math.abs(p)).replace("−","")}` +
        ` <span class="dim pct">${sign(p)}${Math.abs(p/s.starting*100).toFixed(2)}%</span></span>`
      : "—";
    $("ses").innerHTML = `<span class="${s.session==='ACTIVE'?'':'dim'}">${(s.session||"—").toLowerCase()}</span>`;
    $("cyc").textContent = s.cycles ?? "—";
    chart(s.equity_series||[], s.starting||100000);
    positions(s.positions||[]);
    log(s.cycle_log||[]);
    shadow(s.shadow);
    usage(s.usage);
  } catch (e) {
    $("hdr").textContent = "· disconnected";
  }
}
tick(); setInterval(tick, 5000);
</script>
